<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1518" viewBox="0 0 1080 1518">
  <defs>
    <pattern id="grid" width="54" height="75.9" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 75.9" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-small" width="18" height="25.3" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 25.3" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1518" fill="#1a1a2e"/>

  <!-- Grids -->
  <rect width="1080" height="1518" fill="url(#grid-small)"/>
  <rect width="1080" height="1518" fill="url(#grid)"/>

  <!-- Center crosshair -->
  <line x1="540" y1="719" x2="540" y2="799" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <line x1="500" y1="759" x2="580" y2="759" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <circle cx="540" cy="759" r="40" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>

  <!-- Safe zone / Card area (with 2x UV mapping, the full image is visible) -->
  <!-- Outer border (card edge) -->
  <rect x="20" y="20" width="1040" height="1478" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" rx="4"/>
  <!-- Inner border (safe zone) -->
  <rect x="40" y="40" width="1000" height="1438" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="2" stroke-dasharray="8,6"/>

  <!-- Corner marks -->
  <g stroke="rgba(59,130,246,0.6)" stroke-width="2" fill="none">
    <!-- Top-left -->
    <line x1="20" y1="40" x2="20" y2="20" /><line x1="20" y1="20" x2="40" y2="20" />
    <!-- Top-right -->
    <line x1="1060" y1="20" x2="1040" y2="20" /><line x1="1060" y1="20" x2="1060" y2="40" />
    <!-- Bottom-left -->
    <line x1="20" y1="1478" x2="20" y2="1498" /><line x1="20" y1="1498" x2="40" y2="1498" />
    <!-- Bottom-right -->
    <line x1="1060" y1="1498" x2="1040" y2="1498" /><line x1="1060" y1="1498" x2="1060" y2="1478" />
  </g>

  <!-- Rule of thirds guides -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="0.5" stroke-dasharray="4,4">
    <!-- Horizontal thirds -->
    <line x1="0" y1="506" x2="1080" y2="506"/>
    <line x1="0" y1="1012" x2="1080" y2="1012"/>
    <!-- Vertical thirds -->
    <line x1="360" y1="0" x2="360" y2="1518"/>
    <line x1="720" y1="0" x2="720" y2="1518"/>
  </g>

  <!-- Labels -->
  <text x="30" y="55" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    CARD TEMPLATE
  </text>
  <text x="30" y="80" fill="rgba(255,255,255,0.35)" font-family="Arial, sans-serif" font-size="14">
    1080 x 1518 px | Aspect Ratio 0.71:1
  </text>

  <text x="1050" y="1485" fill="rgba(255,255,255,0.2)" font-family="Arial, sans-serif" font-size="13" text-anchor="end">
    card edge (outer)
  </text>
  <text x="1050" y="1502" fill="rgba(255,255,255,0.2)" font-family="Arial, sans-serif" font-size="13" text-anchor="end">
    safe zone (inner dashed)
  </text>

  <!-- Bottom center label -->
  <text x="540" y="120" fill="rgba(255,255,255,0.4)" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" letter-spacing="4">
    VISIBLE CARD AREA
  </text>

  <!-- Instructions -->
  <text x="540" y="145" fill="rgba(255,255,255,0.25)" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    Design within the inner dashed line for safe area
  </text>

  <!-- Aspect ratio note -->
  <text x="540" y="1430" fill="rgba(255,255,255,0.2)" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    Aspect ratio sesuai kolider card (0.8 : 1.125) → gambar penuh muncul di card
  </text>
</svg>
